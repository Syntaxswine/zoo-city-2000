<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZOO CITY 2000</title>
<link rel="stylesheet" href="css/field.css">
</head>
<body>
<header id="strip">
  <h1>ZOO CITY 2000</h1>
  <div id="tools"></div>
  <span id="cost" role="status" aria-live="polite"></span>
  <span id="clock">—</span>
</header>
<main>
  <nav id="palette" aria-label="Build tools"></nav>
  <div id="stage">
    <canvas id="map" tabindex="0"></canvas>
    <div id="bars" title="demand: V_R · V_C · V_I, −1..+1; the dash is the tax term, the tick on R is the cap"></div>
    <div id="flash"></div>
    <div id="banner"></div>
  </div>
  <aside id="panel">
    <div id="stats"></div>
    <section id="card"></section>
    <nav id="tabs"></nav>
    <section id="tabBody"></section>
    <footer id="help"></footer>
  </aside>
</main>
<div id="choice" class="modal" hidden></div>
<div id="news" class="modal" hidden></div>
<div id="newcity" class="modal" hidden></div>
<div id="title" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
