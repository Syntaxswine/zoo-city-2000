<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZOO CITY 2000</title>
<link rel="stylesheet" href="css/field.css">
</head>
<body>
<header id="strip">
  <h1>ZOO CITY 2000</h1>
  <div id="tools"></div>
  <span id="cost"></span>
  <span id="clock">—</span>
</header>
<main>
  <div id="stage">
    <canvas id="map" tabindex="0"></canvas>
    <div id="bars" title="demand: V_R · V_C · V_I, −1..+1; the dash is the tax term, the tick on R is the cap"></div>
    <div id="flash"></div>
    <div id="banner"></div>
  </div>
  <aside id="panel">
    <div id="stats"></div>
    <section id="card"></section>
    <nav id="tabs"></nav>
    <section id="tabBody"></section>
    <footer>
      1 R · 2 C · 3 I · M Meat · 4 Road · B Wall · 5 Tree · 6 Park · 7 Zoo · F fire station · P police · V pacify · 8 Bulldoze · 9 Inspect · D density · Space pause · , . speed · Z undo · S save · L load · O overlays · +/− zoom · arrows / WASD / right-drag pan · N new city · Esc menu
    </footer>
  </aside>
</main>
<div id="choice" class="modal" hidden></div>
<div id="newcity" class="modal" hidden></div>
<div id="title" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
